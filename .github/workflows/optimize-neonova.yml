name: Optimize Neonova branch (one-off, pick what you want)

# Pushes optional optimization commits to the neonova branch. Every item is its
# own commit and its own checkbox, so you can apply ONE at a time, build, test,
# and know exactly what caused any change. Nothing is rewritten; if an item is
# already applied it is skipped. If the branch moved while this ran, run it again.
#
#   zram_zstd         adds zstd as a SELECTABLE zram algorithm. The default stays
#                     lz4, so behavior does not change until you pick zstd yourself:
#                     echo zstd > /sys/block/zram0/comp_algorithm  (before the
#                     disk size is set, so it needs a boot script or the ROM's zram setup)
#   panic_log_tool    adds tools/neonova-save-panic-log.sh, a root boot script that
#                     copies the previous boot's panic log out of pstore, so it is
#                     not lost. Pure userspace: it changes nothing in the kernel.
#   preempt_voluntary EXPERIMENTAL, off by default. Swaps CONFIG_PREEMPT for
#                     PREEMPT_VOLUNTARY: usually a bit more throughput, a bit less
#                     smoothness. A scheduling change, so do NOT combine it with
#                     anything else while you are still chasing the boot panic.
#
# Put this file at .github/workflows/optimize-neonova.yml in your fork and run it.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update"
        type: string
        default: neonova
      zram_zstd:
        description: "Add zstd as a selectable zram algorithm (default stays lz4)"
        type: boolean
        default: false
      panic_log_tool:
        description: "Add the panic-log saver script (userspace only, no kernel change)"
        type: boolean
        default: true
      preempt_voluntary:
        description: "EXPERIMENTAL: PREEMPT_VOLUNTARY instead of PREEMPT"
        type: boolean
        default: false
      devices:
        description: "Devices whose defconfig gets the changes (space separated)"
        type: string
        default: lavender

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          submodules: false

      - name: Validate inputs
        env:
          DEVICES: ${{ inputs.devices }}
        run: |
          [[ "$DEVICES" =~ ^[a-z0-9\ ]+$ ]] || { echo "::error::devices must be lowercase names separated by spaces"; exit 1; }
          for d in $DEVICES; do
            test -f "arch/arm64/configs/vendor/${d}-perf_defconfig" || { echo "::error::no vendor/${d}-perf_defconfig on this branch"; exit 1; }
          done

      - name: Create the commits
        env:
          ZRAM_ZSTD: ${{ inputs.zram_zstd }}
          PANIC_TOOL: ${{ inputs.panic_log_tool }}
          PREEMPT_VOL: ${{ inputs.preempt_voluntary }}
          DEVICES: ${{ inputs.devices }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          START=$(git rev-parse HEAD)

          # sets or replaces a CONFIG_ line in a defconfig; $2 is "y" or "n"
          setcfg() {
            local cfg="$1" opt="$2" val="$3" want
            if [ "$val" = y ]; then want="CONFIG_${opt}=y"; else want="# CONFIG_${opt} is not set"; fi
            # already exactly right: leave the file alone, so a re-run changes nothing
            if grep -qxF "$want" "$cfg"; then return 0; fi
            sed -i -e "/^CONFIG_${opt}=/d" -e "/^# CONFIG_${opt} is not set/d" "$cfg"
            echo "$want" >> "$cfg"
          }

          # ---- 1. zstd as a selectable zram algorithm ---------------------------
          if [ "$ZRAM_ZSTD" = true ]; then
            for d in $DEVICES; do
              CFG="arch/arm64/configs/vendor/${d}-perf_defconfig"
              setcfg "$CFG" CRYPTO_ZSTD y
              git add "$CFG"
            done
            if git diff --cached --quiet; then echo "::notice::zstd already enabled"; else
              git commit -q -m "zram: build zstd so it can be selected at runtime" \
                -m "The zram backend only lists zstd when CONFIG_CRYPTO_ZSTD is set. The default algorithm stays lz4 (CONFIG_ZRAM_DEF_COMP_LZ4), so nothing changes until zstd is chosen. Devices: $DEVICES."
            fi
          fi

          # ---- 2. panic log saver (userspace helper, not part of the kernel) ----
          if [ "$PANIC_TOOL" = true ]; then
            mkdir -p tools
            cat > tools/neonova-save-panic-log.sh <<'NEONOVA_EOF'
          #!/system/bin/sh
          # neonova-save-panic-log.sh
          #
          # Saves the previous boot's kernel log (pstore / last_kmsg) before it is lost.
          # After a kernel panic the log sits in /sys/fs/pstore until the next power-off or
          # until something deletes it, so copy it out on every boot.
          #
          # Install (as root):
          #   cp neonova-save-panic-log.sh /data/adb/service.d/
          #   chmod 755 /data/adb/service.d/neonova-save-panic-log.sh
          # Remove it by deleting that file.
          #
          # Output: /sdcard/Download/neonova-panic-logs/<date-time>/
          # Proof that it ran at all: /data/local/tmp/neonova-panic-saver.log

          OUT_BASE="${OUT_BASE:-/sdcard/Download/neonova-panic-logs}"
          PSTORE="${PSTORE:-/sys/fs/pstore}"
          LOG="${LOG:-/data/local/tmp/neonova-panic-saver.log}"

          echo "$(date '+%Y-%m-%d %H:%M:%S') saver ran" >> "$LOG" 2>/dev/null

          # nothing in pstore: nothing to save
          if [ ! -d "$PSTORE" ] || [ -z "$(ls -A "$PSTORE" 2>/dev/null)" ]; then
            echo "  pstore empty, nothing to save" >> "$LOG" 2>/dev/null
            exit 0
          fi

          # the sdcard may not be mounted yet at this stage: wait up to about 3 minutes
          PARENT="$(dirname "$OUT_BASE")"
          i=0
          while [ ! -d "$PARENT" ] && [ "$i" -lt 90 ]; do
            sleep 2
            i=$((i + 1))
          done
          [ -d "$PARENT" ] || OUT_BASE="/data/local/tmp/neonova-panic-logs"

          DEST="$OUT_BASE/$(date '+%Y%m%d-%H%M%S')"
          mkdir -p "$DEST" || exit 1

          cp -r "$PSTORE"/* "$DEST"/ 2>>"$LOG"
          [ -r /proc/last_kmsg ] && cat /proc/last_kmsg > "$DEST/last_kmsg.txt" 2>/dev/null

          {
            echo "uname: $(uname -a)"
            if command -v getprop >/dev/null 2>&1; then
              echo "boot reason (last): $(getprop sys.boot.reason.last)"
              echo "boot reason history:"
              getprop persist.sys.boot.reason.history
            fi
          } > "$DEST/info.txt" 2>/dev/null

          # only clear pstore once the copy is really there
          if [ -n "$(ls -A "$DEST" 2>/dev/null)" ]; then
            rm -f "$PSTORE"/* 2>/dev/null
            echo "  saved to $DEST" >> "$LOG" 2>/dev/null
          fi
          exit 0
          NEONOVA_EOF
            chmod 755 tools/neonova-save-panic-log.sh
            git add tools/neonova-save-panic-log.sh
            git update-index --chmod=+x tools/neonova-save-panic-log.sh
            if git diff --cached --quiet; then echo "::notice::panic log tool already present"; else
              git commit -q -m "tools: script that saves the previous boot's panic log" \
                -m "Copies /sys/fs/pstore (and /proc/last_kmsg) to /sdcard/Download/neonova-panic-logs on every boot, because the log is otherwise easy to lose. Install by hand into /data/adb/service.d/. It changes nothing in the kernel."
            fi
          fi

          # ---- 3. EXPERIMENTAL: PREEMPT_VOLUNTARY ------------------------------
          if [ "$PREEMPT_VOL" = true ]; then
            for d in $DEVICES; do
              CFG="arch/arm64/configs/vendor/${d}-perf_defconfig"
              setcfg "$CFG" PREEMPT n
              setcfg "$CFG" PREEMPT_VOLUNTARY y
              git add "$CFG"
            done
            if git diff --cached --quiet; then echo "::notice::PREEMPT_VOLUNTARY already set"; else
              git commit -q -m "EXPERIMENTAL: PREEMPT_VOLUNTARY instead of PREEMPT" \
                -m "Less preemption overhead, slightly worse worst-case latency. Revert this commit if the phone feels less smooth. Devices: $DEVICES."
            fi
          fi

          if [ "$(git rev-parse HEAD)" = "$START" ]; then
            echo "Nothing to change; every selected item is already applied."
          fi

      - name: Show what changed
        run: |
          git log --format='%h %an: %s' -6
          grep -nE 'CRYPTO_ZSTD|CONFIG_PREEMPT' "arch/arm64/configs/vendor/${DEVICES%% *}-perf_defconfig" || true
        env:
          DEVICES: ${{ inputs.devices }}

      - name: Push
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git push origin "HEAD:refs/heads/$BRANCH"
