name: Build Neonova kernel

# For the branch created by prepare-branch.yml. Everything we used to patch in at
# build time (ReSukiSU hooks, SuSFS, submodule wiring, defconfig, branding, the
# AnyKernel3 fixes) is already committed in that branch, so this workflow only
# checks out, builds and packages.
#
# Put this file at .github/workflows/build-neonova.yml in your fork and run it.
# Do NOT use the older build.yml on the neonova branch: it would try to apply
# the same patches a second time and fail.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        type: string
        default: neonova
      device:
        description: "Device"
        type: choice
        options: [lavender, whyred, tulip]
        default: lavender
      kernel_name:
        description: "Name used for the zip file (letters, digits, . _ - ; max 40)"
        type: string
        default: Neonova
      lto:
        description: "Extra LTO argument for build.sh (the defconfig may still enable ThinLTO by itself)"
        type: choice
        options: [none, thin]
        default: none
      root:
        description: "Build with root (off = a root-free kernel, e.g. for banking apps)"
        type: boolean
        default: true
      toolchain:
        description: "Compiler: ubuntu-clang-18 (what every earlier build used) or aosp-clang (downloaded, newer)"
        type: choice
        options: [ubuntu-clang-18, aosp-clang]
        default: ubuntu-clang-18
      aosp_clang_tag:
        description: "AOSP clang release when toolchain = aosp-clang (r547379 is what rexsfx uses on the same kernel base)"
        type: string
        default: r547379
      extra_swap:
        description: "Add a 4 GB swap file on the runner (ThinLTO can run out of memory, mostly with a newer clang)"
        type: boolean
        default: true
      compiler_string:
        description: "Compiler text in /proc/version. auto = 'clang <version>' read from the compiler, empty = the long default"
        type: string
        default: auto
      build_user:
        description: "Shown as user@host in /proc/version"
        type: string
        default: Neonova
      build_host:
        description: "Shown as user@host in /proc/version"
        type: string
        default: Amiko

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Validate inputs
        env:
          KERNEL_NAME: ${{ inputs.kernel_name }}
          BUILD_USER: ${{ inputs.build_user }}
          BUILD_HOST: ${{ inputs.build_host }}
          COMPILER_STRING: ${{ inputs.compiler_string }}
          CLANG_TAG: ${{ inputs.aosp_clang_tag }}
        run: |
          [[ "$CLANG_TAG" =~ ^r[0-9]{5,7}[a-z]?$ ]] || { echo "::error::aosp_clang_tag looks like r547379"; exit 1; }
          [[ "$KERNEL_NAME" =~ ^[A-Za-z0-9._-]{1,40}$ ]] || { echo "::error::kernel_name must be 1-40 chars of letters, digits, '.', '_' or '-'"; exit 1; }
          [[ "$BUILD_USER" =~ ^[A-Za-z0-9._-]{1,32}$ ]] || { echo "::error::build_user: letters, digits, . _ - only (max 32)"; exit 1; }
          [[ "$BUILD_HOST" =~ ^[A-Za-z0-9._-]{1,32}$ ]] || { echo "::error::build_host: letters, digits, . _ - only (max 32)"; exit 1; }
          [[ -z "$COMPILER_STRING" || "$COMPILER_STRING" =~ ^[A-Za-z0-9._\ -]{1,60}$ ]] || { echo "::error::compiler_string: letters, digits, spaces and . _ - only (max 60)"; exit 1; }

      - name: Checkout branch (no submodules yet)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          submodules: false

      - name: Check that the branch was prepared
        run: |
          test -f .gitmodules || { echo "::error::no .gitmodules on this branch. Run prepare-branch.yml first."; exit 1; }
          grep -q 'ReSukiSU' .gitmodules || { echo "::error::.gitmodules doesn't point KernelSU at ReSukiSU. Run prepare-branch.yml first."; exit 1; }
          test -f fs/susfs.c || { echo "::error::SuSFS hooks are missing. Run prepare-branch.yml first."; exit 1; }

      - name: Show what is being built
        id: src
        run: |
          # The short commit id goes into the artifact name, so a flashed zip can
          # always be traced back to the exact commit (useful when chasing a panic).
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          git log --format='%h %an: %s' -8
          grep -nE 'LOCALVERSION=|CONFIG_PREEMPT|CRYPTO_ZSTD|CONFIG_KSU|SPOOF_UNAME|LTO_CLANG' \
            "arch/arm64/configs/vendor/${{ inputs.device }}-perf_defconfig" || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio zip unzip xz-utils lz4 \
            python3 device-tree-compiler ccache make libncurses-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          ls -d /usr/lib/llvm-*/bin/clang

      - name: Add swap (helps ThinLTO)
        if: ${{ inputs.extra_swap }}
        run: |
          sudo fallocate -l 4G /swapfile_ci
          sudo chmod 600 /swapfile_ci
          sudo mkswap /swapfile_ci
          sudo swapon /swapfile_ci
          free -h

      - name: Cache AOSP clang
        id: cache-aosp
        if: ${{ inputs.toolchain == 'aosp-clang' }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain/aosp-clang
          key: aosp-clang-${{ inputs.aosp_clang_tag }}

      - name: Download AOSP clang
        if: ${{ inputs.toolchain == 'aosp-clang' && steps.cache-aosp.outputs.cache-hit != 'true' }}
        env:
          TAG: ${{ inputs.aosp_clang_tag }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain/aosp-clang"
          curl -L --fail --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${TAG}.tar.gz" \
            -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C "$GITHUB_WORKSPACE/toolchain/aosp-clang"
          rm -f /tmp/clang.tar.gz

      - name: Select the toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          COMPILER_STRING: ${{ inputs.compiler_string }}
        run: |
          if [ "$TOOLCHAIN" = aosp-clang ]; then
            TC="$GITHUB_WORKSPACE/toolchain/aosp-clang"
            # same extra flags rexsfx uses with AOSP clang on this kernel base
            echo "KCFLAGS=-march=armv8-a -mno-outline" >> "$GITHUB_ENV"
            echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          else
            TC=/usr/lib/llvm-18
          fi
          test -x "$TC/bin/clang" || { echo "::error::no clang in $TC/bin"; ls "$TC" | head; exit 1; }
          "$TC/bin/clang" --version | head -3
          echo "TC_DIR=$TC" >> "$GITHUB_ENV"
          CS="$COMPILER_STRING"
          if [ "$CS" = auto ]; then
            CS=$("$TC/bin/clang" --version | head -1 | grep -oE 'clang version [0-9]+(\.[0-9]+)*' | sed 's/clang version /clang /' || true)
          fi
          echo "KBUILD_COMPILER_STRING=$CS" >> "$GITHUB_ENV"
          echo "compiler text in /proc/version: '$CS'"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-neonova-${{ inputs.device }}-${{ inputs.toolchain }}-${{ github.sha }}
          restore-keys: ccache-neonova-${{ inputs.device }}-${{ inputs.toolchain }}-

      - name: Fetch the submodules (ReSukiSU, NoMount)
        run: |
          # Full history, blobless (fast): ReSukiSU computes its version code from
          # `git rev-list --count HEAD`, so a shallow clone would give a tiny number
          # and the manager would say "kernel update required".
          git submodule update --init --filter=blob:none KernelSU NoMount
          git -C KernelSU log -1 --format='ReSukiSU: %h %cs %s'
          echo "ReSukiSU version code: $((30000 + $(git -C KernelSU rev-list --count HEAD) + 700))"
          git -C NoMount log -1 --format='NoMount: %h %cs %s'
          test -f drivers/kernelsu/Kconfig
          test -f fs/nomount/Kconfig

      - name: Switch root off (only when root is unchecked)
        if: ${{ !inputs.root }}
        run: |
          CFG="arch/arm64/configs/vendor/${{ inputs.device }}-perf_defconfig"
          test -f "$CFG"
          # ReSukiSU's Kconfig defaults KSU to y, so switch it off explicitly
          sed -i -e '/^CONFIG_KSU=/d' -e '/^CONFIG_KSU_SUSFS=/d' "$CFG"
          echo '# CONFIG_KSU is not set' >> "$CFG"
          grep -n 'KSU' "$CFG"

      - name: Prepare AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          test -f AnyKernel3/tools/magiskboot
          rm -rf AnyKernel3/.git

      - name: Set the device name in the flasher
        run: |
          # build.sh hard-codes whyred in the AnyKernel3 device check
          sed -i "s/^device.name1=whyred/device.name1=${{ inputs.device }}/" build.sh
          grep -n '^device.name1' build.sh

      - name: Build
        env:
          DEVICE: ${{ inputs.device }}
          DEFCONFIG: vendor/${{ inputs.device }}-perf_defconfig
          LTO_MODE: ${{ inputs.lto }}
          KERNEL_NAME: ${{ inputs.kernel_name }}
          # build.sh insists on these; OC_BUILD=1 makes it skip Telegram.
          BOT_TOKEN: unused
          CHAT_ID: unused
          OC_BUILD: "1"
          CCACHE_DIR: /home/runner/.cache/ccache
          # /proc/version: "(user@host) (compiler text)"
          KBUILD_BUILD_USER: ${{ inputs.build_user }}
          KBUILD_BUILD_HOST: ${{ inputs.build_host }}
        run: |
          echo "TC_DIR=$TC_DIR  KCFLAGS='${KCFLAGS:-}'  compiler text='${KBUILD_COMPILER_STRING:-}'"
          ls -d "$TC_DIR/bin/clang"
          # keep a full log: it is uploaded below even when the build fails
          set +e
          bash build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.device }}-${{ steps.src.outputs.short }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-${{ inputs.device }}-${{ steps.src.outputs.short }}-${{ inputs.toolchain == 'aosp-clang' && 'aosp' || 'ubuntu' }}
          path: ${{ inputs.kernel_name }}-${{ inputs.device }}-*.zip
          if-no-files-found: error
